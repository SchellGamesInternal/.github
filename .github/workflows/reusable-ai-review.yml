name: Reusable AI Code Review

on:
  workflow_call:

jobs:
  ai-review:
    runs-on: [self-hosted, upm-runner]
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4

      - name: Checkout Schell Games AI Reviewer
        run: |
          rm -rf .org-configs
          git clone --depth 1 "https://${UNITY_FRAMEWORK_PAT}@github.com/SchellGamesInternal/.github.git" .org-configs

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Execute AI Code Review
        run: python3 .org-configs/scripts/ai_reviewer/review.py