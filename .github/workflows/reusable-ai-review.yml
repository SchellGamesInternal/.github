name: Reusable AI Code Review

on:
  workflow_call:

jobs:
  ai-review:
    runs-on: [self-hosted, Linux, upm-runner]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Target Repository
        uses: actions/checkout@v4

      - name: Checkout Schell Games AI Reviewer
        run: |
          rm -rf .org-configs
          git clone --depth 1 "https://${UNITY_FRAMEWORK_PAT}@github.com/SchellGamesInternal/.github.git" .org-configs

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Execute AI Code Review
        run: |
          REVIEW_SCRIPT=$(find .org-configs -name "review.py" | head -n 1)

          if [ -z "$REVIEW_SCRIPT" ]; then
            echo "Error: review.py was not found in .org-configs!"
            exit 1
          fi

          echo "Running review script: ${REVIEW_SCRIPT}"
          python3 "${REVIEW_SCRIPT}"