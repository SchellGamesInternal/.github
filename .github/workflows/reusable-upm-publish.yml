name: Reusable UPM Pack & Publish

on:
  workflow_call:
    inputs:
      registry-url:
        required: false
        type: string
        default: 'http://172.16.0.69:4873'
    secrets:
      UPM_SERVICE_ACCOUNT_KEY_ID:
        required: true
      UPM_SERVICE_ACCOUNT_KEY_SECRET:
        required: true
      UPM_ORGANIZATION_ID:
        required: true
      VERDACCIO_TOKEN:
        required: true

jobs:
  build-and-publish:
    runs-on: [self-hosted, upm-runner]

    steps:
      - name: Checkout Package Repository
        uses: actions/checkout@v4

      - name: Fetch Master Configuration from .github Repo
        uses: actions/checkout@v4
        with:
          repository: 'SchellGamesInternal/.github'
          path: '.org-configs'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Python Publish Engine
        shell: bash
        env:
          VERDACCIO_TOKEN: ${{ secrets.VERDACCIO_TOKEN }}
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
          UPM_ORGANIZATION_ID: ${{ secrets.UPM_ORGANIZATION_ID }}
          VERDACCIO_URL: ${{ inputs.registry-url }}
          PATH: "$HOME/.local/bin:/opt/upm/bin:/usr/local/bin:C:\\upm\\bin:${{ env.PATH }}"
        run: |
          if [ -f ".org-configs/scripts/publish.py" ]; then
            python3 .org-configs/scripts/publish.py || python .org-configs/scripts/publish.py
          elif [ -f ".org-configs/.github/scripts/publish.py" ]; then
            python3 .org-configs/.github/scripts/publish.py || python .org-configs/.github/scripts/publish.py
          else
            echo "Error: Could not locate publish.py in .org-configs repository"
            exit 1
          fi