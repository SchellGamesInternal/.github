name: Reusable UPM Pack & Publish

on:
  workflow_call:
    inputs:
      registry-url:
        required: false
        type: string
        default: 'http://172.16.0.69:4873'
    secrets:
      UPM_SERVICE_ACCOUNT_KEY_ID:
        required: false
      UPM_SERVICE_ACCOUNT_KEY_SECRET:
        required: false
      UPM_ORGANIZATION_ID:
        required: false
      VERDACCIO_TOKEN:
        required: false

jobs:
  build-and-publish:
    runs-on: [self-hosted, upm-runner]
    
    steps:
      - name: Checkout Package Repository
        uses: actions/checkout@v4

      - name: Fetch Central Configs & Python Script
        uses: actions/checkout@v4
        with:
          repository: 'SchellGamesInternal/.github'
          path: '.org-configs'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Python Publish Script
        env:
          REGISTRY_URL: ${{ inputs.registry-url }}
          # Uses repo secret if provided, otherwise falls back to runner's .env
          UPM_ORGANIZATION_ID: ${{ secrets.UPM_ORGANIZATION_ID || env.UPM_ORGANIZATION_ID }}
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID || env.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET || env.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
          VERDACCIO_TOKEN: ${{ secrets.VERDACCIO_TOKEN || env.VERDACCIO_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python3 .org-configs/scripts/publish.py