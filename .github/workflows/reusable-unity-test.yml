name: Reusable Unity Package Test Trigger

on:
  workflow_call:
    inputs:
      jenkins-webhook-url:
        required: false
        type: string
        default: 'https://build.schellgames.com/generic-webhook-trigger/invoke?token=schell-unity-pr-test-token'

jobs:
  trigger-jenkins-test:
    runs-on: [self-hosted, upm-runner]

    steps:
      - name: Trigger Internal Jenkins Test Pipeline
        shell: bash
        run: |
          # GITHUB_REPOSITORY is always populated as 'Owner/Repo' (e.g. SchellGamesInternal/VerdaccioTest)
          REPO_FULL="${GITHUB_REPOSITORY}"
          REPO_OWNER="${REPO_FULL%%/*}"
          REPO_NAME="${REPO_FULL#*/}"
          
          TARGET_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          PR_NUM="${{ github.event.pull_request.number || '0' }}"

          echo "Triggering Jenkins for ${REPO_OWNER}/${REPO_NAME} @ SHA ${TARGET_SHA} (PR #${PR_NUM})..."

          # Pass parameters directly in URL query string to avoid JSON body parsing issues
          TRIGGER_URL="${{ inputs.jenkins-webhook-url }}&REPO_OWNER=${REPO_OWNER}&REPO_NAME=${REPO_NAME}&COMMIT_SHA=${TARGET_SHA}&PR_NUMBER=${PR_NUM}"

          RESPONSE=$(curl -k -s -X POST "${TRIGGER_URL}")
          echo "Jenkins response: ${RESPONSE}"